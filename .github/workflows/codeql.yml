# CodeQL code scanning — free for public repositories.
# build-mode "none" analyses the source without compiling, so it works for Windows-only projects on Linux runners.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
          - language: actions
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - "**/wwwroot/lib/**"
              - "**/Map/leaflet.js"
              - "**/node_modules/**"

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
